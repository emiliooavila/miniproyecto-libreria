<header class="main-header">
  <div class="logo-container" routerLink="/">
  <img src="logo.jpg" alt="Logo" class="logo-img">
</div>

  <nav class="nav-links">
    <a routerLink="/inicio" routerLinkActive="active">Inicio</a>
    <a routerLink="/catalogo" routerLinkActive="active">Catálogo</a>
    <a routerLink="/contacto" routerLinkActive="active">Contacto</a>
  </nav>

  <div class="user-actions" style="display: flex; align-items: center; gap: 15px;">
    
    <button *ngIf="authService.esAdmin()" routerLink="/agregar-producto" class="cart-btn" style="background: transparent; border: 1px dashed white;">Añadir Libro</button>
    
    <div *ngIf="authService.usuarioActual()" style="display: flex; align-items: center; gap: 10px;">
      <span style="color: white; font-weight: 500;">Hola, {{ authService.usuarioActual() }}</span>
      <button (click)="authService.logout()" title="Cerrar Sesion" style="background: transparent; color: white; border: none; cursor: pointer; display: flex; align-items: center; padding: 5px; opacity: 0.8; transition: 0.3s;" onmouseover="this.style.opacity='1'; this.style.color='#ff4d4d'" onmouseout="this.style.opacity='0.8'; this.style.color='white'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </div>

    <button *ngIf="!authService.usuarioActual()" routerLink="/login" class="cart-btn" style="background: transparent; border: 1px solid white;">Iniciar Sesion</button>

    <button class="cart-btn" routerLink="/carrito" style="display: flex; align-items: center; gap: 5px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
      </svg>
      Carrito ({{ carritoService.totalUnidades() }})
    </button>
  </div>
</header>
