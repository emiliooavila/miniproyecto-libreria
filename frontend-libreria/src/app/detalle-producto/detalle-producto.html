<div *ngIf="libro" style="padding: 20px; max-width: 600px; margin: auto;">
  <button routerLink="/catalogo" style="margin-bottom: 20px;">⬅ Volver al catálogo</button>
  
  <div style="display: flex; gap: 20px;">
    <img [src]="libro.imagen" alt="{{ libro.nombre }}" width="250" style="border-radius: 8px;">
    
    <div>
      <h1>{{ libro.nombre }}</h1>
      <h3 style="color: gray;">{{ libro.marca }}</h3>
      <p style="font-size: 1.2rem; color: #d35400;"><strong>{{ libro.precio | currency }}</strong></p>
      
      <p style="margin-top: 20px;"><strong>Sinopsis:</strong><br> {{ libro.descripcion }}</p>
      
      <p>Categoría: {{ libro.categoria }}</p>
      <button style="padding: 10px 20px; background-color: #28a745; color: white; border: none; cursor: pointer;">Comprar Ahora</button>
    </div>
  </div>
</div>

<div *ngIf="!libro">
  <p>Cargando información del libro...</p>
</div>
