<div class="catalogo-layout">
  <aside class="filtros-sidebar">
    <h3>Filtros</h3>
    
    <div class="filtro-grupo">
      <label>Categoría</label>
      <select [(ngModel)]="categoriaSeleccionada">
        <option value="">Todas</option>
        <option value="Ciencia Ficcion">Ciencia Ficción</option>
        <option value="Fantasia">Fantasía</option>
        <option value="Terror">Terror</option>
      </select>
    </div>

    <div class="filtro-grupo">
      <label>Precio Máximo</label>
      <input type="range" min="0" max="2000" step="50" [(ngModel)]="precioMaximo">
      <div class="rango-valores">
        <span>$0</span>
        <span>{{ precioMaximo | currency }}</span> 
      </div>
    </div>
  </aside>

  <div class="catalogo-main">
    <h2 class="title">Catálogo de Libros</h2>

    <div class="catalogo-grid">
      <div *ngFor="let libro of librosFiltrados" class="card-libro">
        
        <div class="portada-container">
          <img *ngIf="libro.imagen" [src]="libro.imagen" alt="{{libro.nombre}}">
          <img *ngIf="!libro.imagen && libro.isbn"
               src="https://covers.openlibrary.org/b/isbn/{{ libro.isbn }}-M.jpg" alt="{{libro.nombre}}">
        </div>

        <div class="info-libro">
          <h3>{{ libro.nombre }}</h3>
          <p class="editorial">{{ libro.marca }}</p>
          <p class="precio">{{ libro.precio | currency }}</p>

          <p class="stock ok" *ngIf="libro.stock > 0">Disponible</p>
          <p class="stock no" *ngIf="libro.stock === 0">Agotado</p>

          <div class="acciones">
            <button [routerLink]="['/productos', libro.id]" class="btn-ver">Ver</button>
            <button class="carrito">Agregar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
