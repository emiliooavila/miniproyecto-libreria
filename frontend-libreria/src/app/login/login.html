<div class="login-container">
  <div class="login-card">
    <h2>Iniciar Sesion</h2>
    <p>Bienvenido de nuevo a Alpha Proxima</p>

    <!-- Formulario Template-Driven -->
    <form (ngSubmit)="iniciarSesion()" #loginForm="ngForm" class="login-form">
      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input 
          type="text" 
          id="nombre" 
          name="nombre" 
          [(ngModel)]="nombre" 
          required 
          placeholder="Tu nombre"
          autocomplete="off">
      </div>

      <div class="form-group">
        <label for="contrasena">Contrasena</label>
        <input 
          type="password" 
          id="contrasena" 
          name="contrasena" 
          [(ngModel)]="contrasena" 
          required 
          placeholder="********">
      </div>

      <button type="submit" class="btn-login" [disabled]="!loginForm.form.valid">
        Ingresar
      </button>
    </form>
  </div>
</div>

<!-- Toast notification -->
<div class="toast-container" *ngIf="toastMensaje">
  <div class="toast">{{ toastMensaje }}</div>
</div>
