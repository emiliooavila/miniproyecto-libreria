<section class="page page-contacto">
  <div class="contact-card">
    <div class="contact-header">
      <h1>¡Escríbenos!</h1>
    </div>

    <div *ngIf="mensajeEnviado" class="success-box">
      ¡Gracias! Tu mensaje ha sido enviado y guardado en la base de datos.
    </div>

    <form [formGroup]="contactoForm" (ngSubmit)="enviarDatos()" class="contact-form">
      <div class="field">
        <label>Nombre</label>
        <input type="text" formControlName="nombre" placeholder="Tu nombre">
        <span *ngIf="contactoForm.get('nombre')?.invalid && contactoForm.get('nombre')?.touched" class="error">
          El nombre es obligatorio.
        </span>
      </div>

      <div class="field">
        <label>Correo electrónico</label>
        <input type="email" formControlName="correo" placeholder="ejemplo@dominio.com">
        <span *ngIf="contactoForm.get('correo')?.hasError('required') && contactoForm.get('correo')?.touched" class="error">
          El correo es obligatorio.
        </span>
        <span *ngIf="contactoForm.get('correo')?.hasError('email') && contactoForm.get('correo')?.touched" class="error">
          Debe ser un correo válido (ejemplo@dominio.com).
        </span>
      </div>

      <div class="field">
        <label>Asunto</label>
        <input type="text" formControlName="asunto" placeholder="Motivo del mensaje">
      </div>

      <div class="field">
        <label>Mensaje</label>
        <textarea formControlName="mensaje" rows="5" placeholder="Escribe tu mensaje"></textarea>
      </div>

      <button type="submit" class="btn btn-primary submit-btn">
        Enviar mensaje
      </button>
    </form>
  </div>
</section>
